<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fact Genius</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Rubik:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* משתנים לערכת נושא בהירה */
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --accent-color: #4FD1C5; /* טורקיז בהיר */
            --accent-hover: #38B2AC;
            --shadow-light: 6px 6px 12px #d1d9e6, -6px -6px 12px #ffffff;
            --shadow-inset: inset 4px 4px 8px #d1d9e6, inset -4px -4px 8px #ffffff;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Outfit', sans-serif;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        /* כרטיס בהיר בסגנון ניומרפיזם */
        .light-card {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 40px;
            box-shadow: var(--shadow-light);
        }

        /* עיצוב חדש ללוגו (במקום האנימציה) */
        .logo-wrapper {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            background: var(--bg-color);
            border-radius: 50%;
            padding: 20px;
            box-shadow: var(--shadow-light);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        h1 {
            font-weight: 700;
            font-size: 1.8rem;
            margin: 0;
            color: var(--text-primary);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* אזור התמונה המתחלפת */
        #fact-image-container {
            width: 100%;
            height: 200px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: var(--shadow-light);
            display: none; /* מוסתר עד שיש תמונה */
            background-color: #eee;
        }

        #fact-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s;
        }

        /* אזור הטקסט */
        #fact-box {
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            line-height: 1.5;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--bg-color);
            border-radius: 15px;
            box-shadow: var(--shadow-inset);
            color: var(--text-primary);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        select {
            background: var(--bg-color);
            border: none;
            color: var(--text-primary);
            padding: 12px;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            box-shadow: var(--shadow-light);
            transition: 0.3s;
        }

        select:hover {
            box-shadow: var(--shadow-inset);
        }

        /* כפתור הפעולה */
        .btn-bright {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 50px;
            background: var(--accent-color);
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(79, 209, 197, 0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-bright:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 209, 197, 0.4);
        }

        .btn-bright:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 30px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="light-card">
            
            <div class="logo-wrapper">
                <img src="https://cdn-icons-png.flaticon.com/512/4712/4712038.png" alt="Robot Logo" class="logo-img">
            </div>

            <h1>AI Fact Genius</h1>
            <div class="subtitle">Powered by Kubernetes</div>

            <div class="controls">
                <select id="lang-select">
                    <option value="en">English</option>
                    <option value="he">עברית</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                </select>
                <select id="category-select">
                    <option value="random">Random</option>
                    <option value="science">Science</option>
                    <option value="history">History</option>
                </select>
            </div>

            <div id="fact-image-container">
                <img id="fact-image" src="" alt="Fact Image">
            </div>

            <div id="fact-box">
                מוכנים להחכים? לחצו על הכפתור!
            </div>

            <button class="btn-bright" onclick="fetchFact()" id="generate-btn">
                <span>גלה לי משהו חדש</span>
            </button>

            <div class="footer">
                Pod: <span id="pod-name">{{ hostname }}</span> | Ver: 8.0 Logo Fix
            </div>
        </div>
    </div>

    <script>
        async function fetchFact() {
            const btn = document.getElementById('generate-btn');
            const factBox = document.getElementById('fact-box');
            const imgContainer = document.getElementById('fact-image-container');
            const img = document.getElementById('fact-image');
            const lang = document.getElementById('lang-select').value;
            const category = document.getElementById('category-select').value;
            
            // UI Loading State
            btn.classList.add('loading');
            btn.innerHTML = '<span>מעבד נתונים...</span>';
            factBox.style.opacity = '0.5';
            imgContainer.style.opacity = '0.5';

            try {
                const response = await fetch(`/api/fact?lang=${lang}&category=${category}`);
                const data = await response.json();
                
                // עדכון טקסט
                factBox.innerText = data.fact;
                
                // עדכון תמונה (רק אם הגיעה תמונה תקינה)
                if (data.image) {
                    img.src = data.image;
                    img.onload = () => {
                        imgContainer.style.display = 'block';
                    };
                }
                
                document.getElementById('pod-name').innerText = data.pod;

                // טיפול בכיוון שפה (RTL לעברית)
                if (lang === 'he') {
                    factBox.style.direction = 'rtl';
                    factBox.style.fontFamily = "'Rubik', sans-serif";
                    btn.querySelector('span').innerText = "גלה לי עוד משהו";
                } else {
                    factBox.style.direction = 'ltr';
                    factBox.style.fontFamily = "'Outfit', sans-serif";
                    btn.querySelector('span').innerText = "Tell Me More";
                }

            } catch (e) {
                console.error(e);
                factBox.innerText = "שגיאת תקשורת. נסו שוב.";
            }

            // Reset UI
            btn.classList.remove('loading');
            factBox.style.opacity = '1';
            imgContainer.style.opacity = '1';
        }
    </script>
</body>
</html>
