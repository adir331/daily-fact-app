<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Fact Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;500;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --card-bg: #ffffff;
            --primary-color: #6C5CE7;
            --text-color: #2d3436;
            --secondary-text: #636e72;
        }

        body {
            background: linear-gradient(to right, #CFDEF3, #E0EAFC);
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: var(--text-color);
        }

        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 600px;
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover { transform: translateY(-5px); }

        h1 {
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .subtitle {
            color: var(--secondary-text);
            font-size: 0.9rem;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #fact-area {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 40px;
            color: #444;
        }

        button {
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.2);
            background-color: var(--primary-color);
            color: white;
        }

        button:hover {
            background-color: #5649c0;
            box-shadow: 0 15px 25px rgba(108, 92, 231, 0.4);
        }

        .meta-info {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #b2bec3;
            border-top: 1px solid #f1f2f6;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Did You Know?</h1>
        <div class="subtitle">Daily Intelligence</div>

        <div id="fact-area">
            Click the button to learn something new.
        </div>

        <button onclick="fetchFact()">Inspire Me</button>

        <div class="meta-info">
            Served by Pod: <span id="pod-name">{{ hostname }}</span>
        </div>
    </div>

    <script>
        async function fetchFact() {
            const contentDiv = document.getElementById('fact-area');
            contentDiv.style.opacity = '0.5';
            
            try {
                // אין צורך יותר בפרמטר שפה
                const response = await fetch('/api/fact');
                const data = await response.json();
                
                contentDiv.innerText = data.fact;
                document.getElementById('pod-name').innerText = data.pod;
            } catch (e) {
                contentDiv.innerText = "Error loading data.";
            }
            
            contentDiv.style.opacity = '1';
        }
    </script>
</body>
</html>
