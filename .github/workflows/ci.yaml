name: CI Multi-Arch Build

on:
  push:
    branches: [ "main" ]

jobs:
  build-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # שלב חדש 1: התקנת האמולטור QEMU (כדי שנוכל לבנות ל-ARM)
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # שלב משודרג: בנייה לשתי הפלטפורמות במקביל
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        # כאן הקסם קורה: אנחנו בונים גם ל-PC רגיל וגם למק/שרתים חדשים
        platforms: linux/amd64,linux/arm64
        tags: ${{ secrets.DOCKER_USERNAME }}/daily-fact-app:v6
