name: CI Build & Push

on:
  push:
    branches: [ "main" ]

jobs:
  build-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # שלב חדש: התחברות לדוקר האב באמצעות הסודות ששמרנו
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # שלב משודרג: בנייה + דחיפה
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        # כאן אנחנו נותנים תגית "latest"
        tags: ${{ secrets.DOCKER_USERNAME }}/daily-fact-app:latest
